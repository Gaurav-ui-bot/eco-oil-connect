<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register or Login | Eco Oil Connect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<main id="content">
  <div class="wrap" style="max-width:720px">
    <div class="page-head">
      <div class="eyebrow">Your account</div>
      <h1>Register or log in</h1>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" id="tabLogin" class="on" role="tab">Log in</button>
      <button type="button" id="tabReg" role="tab">Register</button>
    </div>

    <form id="loginForm" class="card edge form-grid" novalidate>
      <div class="field full"><label for="lemail">Email</label><input id="lemail" type="email" autocomplete="username" required></div>
      <div class="field full"><label for="lpass">Password</label><input id="lpass" type="password" autocomplete="current-password" required></div>
      <p class="err full" id="lerr" role="alert"></p>
      <div class="full"><button class="btn primary" type="submit">Log in</button></div>
    </form>

    <form id="regForm" class="card edge form-grid" novalidate hidden>
      <div class="field full">
        <label for="role">I am registering as</label>
        <select id="role"><option value="restaurant">Restaurant (hotel or cloud kitchen)</option><option value="collector">Oil collector</option></select>
      </div>
      <div class="field"><label for="name" id="nameLbl">Restaurant or hotel name</label><input id="name" required></div>
      <div class="field"><label for="contact">Contact person</label><input id="contact" required></div>
      <div class="field"><label for="phone">Phone</label><input id="phone" type="tel" required></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field full"><label for="address" id="addrLbl">Address</label><input id="address" required></div>
      <div class="field" id="weeklyWrap"><label for="weekly">Estimated used oil per week (litres)</label><input id="weekly" type="number" min="0" step="1" value="10"></div>
      <div class="field"><label for="password">Password (6 or more characters)</label><input id="password" type="password" autocomplete="new-password" required></div>
      <p class="err full" id="rerr" role="alert"></p>
      <div class="full"><button class="btn primary" type="submit">Create account</button></div>
    </form>
  </div>
</main>
<div id="foot"></div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  EOC.boot();
  var $ = function (id) { return document.getElementById(id); };
  var next = new URLSearchParams(location.search).get('next');
  function go() { location.href = (next && /^[a-z]+\.html$/.test(next)) ? next : 'dashboard.html'; }
  if (EOC.me()) go();

  function show(which) {
    var reg = which === 'reg';
    $('loginForm').hidden = reg; $('regForm').hidden = !reg;
    $('tabLogin').classList.toggle('on', !reg); $('tabReg').classList.toggle('on', reg);
  }
  $('tabLogin').onclick = function () { show('login'); };
  $('tabReg').onclick = function () { show('reg'); };

  $('role').onchange = function () {
    var col = this.value === 'collector';
    $('nameLbl').textContent = col ? 'Collector or company name' : 'Restaurant or hotel name';
    $('addrLbl').textContent = col ? 'Base address' : 'Address';
    $('weeklyWrap').hidden = col;
  };

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = EOC.login($('lemail').value, $('lpass').value);
    if (!u) { $('lerr').textContent = 'Email or password is not right.'; return; }
    go();
  });
  $('regForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = ['name', 'contact', 'phone', 'email', 'address', 'password'];
    for (var i = 0; i < f.length; i++) {
      if (!$(f[i]).value.trim()) { $('rerr').textContent = 'Fill in every field.'; $(f[i]).focus(); return; }
    }
    var res = EOC.register({
      role: $('role').value, name: $('name').value, contact: $('contact').value, phone: $('phone').value,
      email: $('email').value, address: $('address').value, weekly: $('weekly').value, password: $('password').value
    });
    if (!res.ok) { $('rerr').textContent = res.error; return; }
    go();
  });
  if (location.hash === '#register') show('reg');
</script>
</body>
</html>
